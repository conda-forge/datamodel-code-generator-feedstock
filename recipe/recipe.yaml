schema_version: 1

context:
  name: datamodel-code-generator
  version: "0.90.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/datamodel_code_generator-${{ version }}.tar.gz
  sha256: 53869907ee63fd11801d29779c91a5542d67c11b578f071d3a9dd53111d13930

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - datamodel-codegen=datamodel_code_generator.__main__:main

requirements:
  host:
    - pip
    - hatchling >=1.25
    - hatch-vcs >=0.4
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - argcomplete >=2.10.1,<4
    # Need black >=26.5 for python 15
    - black >=26.5
    - genson >=1.2.1,<2
    - inflect >=4.1,<8
    - isort >=4.3.21,<9
    - jinja2 >=2.10.1,<4
    - pydantic >=2,!=2.10,!=2.10.1,!=2.10.2,<3
    - pyyaml >=6.0.1
    - typing_extensions >=4.16,<5

tests:
  - python:
      imports:
        - datamodel_code_generator
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - datamodel-codegen --help

about:
  summary: Pydantic model and dataclasses.dataclass generator for easy conversion of JSON, OpenAPI, JSON Schema, and YAML data sources.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/koxudaxi/datamodel-code-generator
  documentation: https://koxudaxi.github.io/datamodel-code-generator/

extra:
  recipe-maintainers:
    - thewchan
